run_name: run5_coupled_synth_mix

# Patch canvas & 8-layer Transformer geometry (16,317,344 params)
patch_size: 32
max_patches: 128
strip_rows: 32
d_model: 384
n_layers: 8
n_heads: 6
d_ff: 1024
rope_max_pos: 128
rope_base: 10000.0
norm_eps: 1.0e-6

# Data sampling, synthetic augmentation, and loss weighting
sampling_alpha: 0.35
loss_mode: per_series_damped
loss_damping_tau: 12.0
synth_prob: 0.15

# Normalization, masking, horizon span, and blackout dropout
scaling_mode: observed_frozen_origin
eps_sigma: 0.01
exclude_blank_keys: true
max_horizon_patches: 32
history_blackout_prob: 0.30

# Stem channels, monotone head, and cross-variate GroupAttention
use_local_scale_and_lags: true
head_type: median_probit
use_group_attn: true
group_attn_layers: [3, 7]

# Training & validation schedule (WSD with 5-snapshot cooldown soup)
seed: 42
total_steps: 20000
warmup_steps: 1000
cooldown_start_step: 15000
soup_steps: [16000, 17000, 18000, 19000, 20000]
lr: 3.0e-4
min_lr_ratio: 0.05
weight_decay: 0.01
grad_clip: 1.0
batch_size: 1
num_workers: 2
val_every_steps: 2000
val_num_series: 1500
